<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opinion Polling Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface-hover: #242840;
      --border: #2e3348;
      --text: #e4e6f0;
      --text-muted: #8b8fa8;
      --accent: #6c8cff;
      --accent-hover: #8da6ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .layout {
      display: flex;
      height: calc(100vh - 62px);
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
    }

    .filter-tab {
      flex: 1;
      padding: 0.4rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .poll-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .poll-item {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .poll-item:hover {
      background: var(--surface-hover);
    }

    .poll-item.active {
      background: var(--surface-hover);
      border-left: 3px solid var(--accent);
    }

    .poll-item .poll-name {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .poll-item .poll-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .poll-type-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .badge-tracking { background: #1e3a5f; color: #6cb4ee; }
    .badge-snapshot { background: #3a2a1e; color: #eeb86c; }

    /* Main content */
    .main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .poll-display {
      max-width: 900px;
      margin: 0 auto;
    }

    .poll-title-bar {
      margin-bottom: 1.75rem;
    }

    .poll-title-bar h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .poll-title-bar .poll-description {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .poll-info-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .info-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .info-chip .label {
      color: var(--text-muted);
      margin-right: 0.4rem;
    }

    /* Chart container */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .chart-card canvas {
      width: 100% !important;
      max-height: 400px;
    }

    /* Snapshot display */
    .snapshot-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .snapshot-question {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .snapshot-question h3 {
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
      font-weight: 500;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.85rem;
      gap: 0.75rem;
    }

    .bar-label {
      width: 140px;
      min-width: 140px;
      font-size: 0.85rem;
      text-align: right;
      color: var(--text);
    }

    .bar-track {
      flex: 1;
      height: 28px;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: width 0.6s ease;
      min-width: fit-content;
    }

    .bar-value {
      width: 50px;
      min-width: 50px;
      text-align: right;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Legend for line chart */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 0.75rem;
    }

    .empty-state svg {
      opacity: 0.3;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; max-height: 45vh; }
      .layout { flex-direction: column; height: auto; }
      .main { padding: 1rem; }
      .bar-label { width: 100px; min-width: 100px; font-size: 0.78rem; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Polling Dashboard</h1>
    <div class="subtitle">Opinion poll tracker and results viewer</div>
  </div>
  <div style="color: var(--text-muted); font-size: 0.8rem;">
    Last updated: <span id="lastUpdated"></span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Polls</h2>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterPolls('all')">All</button>
        <button class="filter-tab" onclick="filterPolls('tracking')">Tracking</button>
        <button class="filter-tab" onclick="filterPolls('snapshot')">Snapshot</button>
      </div>
    </div>
    <div class="poll-list" id="pollList"></div>
  </aside>

  <main class="main" id="mainContent">
    <div class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 4 5-8"/></svg>
      <div>Select a poll from the sidebar to view results</div>
    </div>
  </main>
</div>

<script>
// ──────────────────────────────────────────────
// DATA — loaded from data/polls.json
// ──────────────────────────────────────────────

const COLORS = [
  '#6c8cff', '#ff6c8c', '#8cff6c', '#ffb86c',
  '#c06cff', '#6cffe0', '#ff6ce0', '#ffe06c'
];

let polls = [];

// ──────────────────────────────────────────────
// APP STATE
// ──────────────────────────────────────────────
let currentFilter = 'all';
let activePollId = null;
let chartInstance = null;

// ──────────────────────────────────────────────
// RENDER SIDEBAR
// ──────────────────────────────────────────────
function renderPollList() {
  const list = document.getElementById('pollList');
  const filtered = currentFilter === 'all'
    ? polls
    : polls.filter(p => p.type === currentFilter);

  list.innerHTML = filtered.map(p => `
    <div class="poll-item ${activePollId === p.id ? 'active' : ''}"
         onclick="selectPoll('${p.id}')">
      <div class="poll-name">${p.name}</div>
      <div class="poll-meta">
        <span class="poll-type-badge ${p.type === 'tracking' ? 'badge-tracking' : 'badge-snapshot'}">
          ${p.type}
        </span>
        <span>${p.source}</span>
      </div>
    </div>
  `).join('');
}

function filterPolls(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderPollList();
}

// ──────────────────────────────────────────────
// SELECT & DISPLAY A POLL
// ──────────────────────────────────────────────
function selectPoll(id) {
  activePollId = id;
  const poll = polls.find(p => p.id === id);
  renderPollList();

  if (poll.type === 'tracking') {
    renderTrackingPoll(poll);
  } else {
    renderSnapshotPoll(poll);
  }
}

// ──────────────────────────────────────────────
// TRACKING POLL (LINE CHART)
// ──────────────────────────────────────────────
function renderTrackingPoll(poll) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="poll-display">
      <div class="poll-title-bar">
        <h2>${poll.name}</h2>
        <div class="poll-description">${poll.description}</div>
      </div>
      <div class="poll-info-row">
        <div class="info-chip"><span class="label">Source:</span>${poll.source}</div>
        <div class="info-chip"><span class="label">Sample:</span>${poll.sampleSize}</div>
        <div class="info-chip"><span class="label">Frequency:</span>${poll.frequency}</div>
      </div>
      <div class="chart-card">
        <canvas id="trackingChart"></canvas>
        <div class="chart-legend" id="chartLegend"></div>
      </div>
      <div class="chart-card">
        <h3 style="font-size:0.9rem; margin-bottom:1rem; color:var(--text-muted);">Latest Values</h3>
        <div id="latestValues"></div>
      </div>
    </div>
  `;

  // Build chart
  const ctx = document.getElementById('trackingChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const datasets = poll.series.map((s, i) => ({
    label: s.name,
    data: s.data,
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + '18',
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false
  }));

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: poll.labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1d2e',
          borderColor: '#2e3348',
          borderWidth: 1,
          titleColor: '#e4e6f0',
          bodyColor: '#e4e6f0',
          padding: 12,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%`
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#2e334830' },
          ticks: { color: '#8b8fa8' }
        },
        y: {
          grid: { color: '#2e334830' },
          ticks: { color: '#8b8fa8', callback: v => v + '%' }
        }
      }
    }
  });

  // Legend
  document.getElementById('chartLegend').innerHTML = poll.series.map((s, i) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
      <span>${s.name}</span>
    </div>
  `).join('');

  // Latest values
  document.getElementById('latestValues').innerHTML = poll.series.map((s, i) => {
    const latest = s.data[s.data.length - 1];
    const prev = s.data[s.data.length - 2];
    const diff = latest - prev;
    const arrow = diff > 0 ? '&#9650;' : diff < 0 ? '&#9660;' : '&#8212;';
    const diffColor = diff > 0 ? '#8cff6c' : diff < 0 ? '#ff6c8c' : 'var(--text-muted)';
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
          <span>${s.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <span style="font-weight:600;font-size:1.1rem;">${latest}%</span>
          <span style="color:${diffColor};font-size:0.8rem;">${arrow} ${Math.abs(diff)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ──────────────────────────────────────────────
// SNAPSHOT POLL (HORIZONTAL BARS)
// ──────────────────────────────────────────────
function renderSnapshotPoll(poll) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="poll-display">
      <div class="poll-title-bar">
        <h2>${poll.name}</h2>
        <div class="poll-description">${poll.description}</div>
      </div>
      <div class="poll-info-row">
        <div class="info-chip"><span class="label">Source:</span>${poll.source}</div>
        <div class="info-chip"><span class="label">Sample:</span>${poll.sampleSize}</div>
        <div class="info-chip"><span class="label">Date:</span>${poll.date}</div>
      </div>
      <div class="snapshot-container" id="snapshotContainer"></div>
    </div>
  `;

  const container = document.getElementById('snapshotContainer');
  container.innerHTML = poll.questions.map(q => {
    const maxVal = Math.max(...q.options.map(o => o.value));
    const bars = q.options.map((opt, i) => {
      const color = COLORS[i % COLORS.length];
      const width = (opt.value / maxVal) * 100;
      return `
        <div class="bar-row">
          <div class="bar-label">${opt.label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${width}%;background:${color};">${opt.value > 8 ? opt.value + '%' : ''}</div>
          </div>
          <div class="bar-value" style="color:${color}">${opt.value}%</div>
        </div>
      `;
    }).join('');

    return `
      <div class="snapshot-question">
        <h3>${q.text}</h3>
        ${bars}
      </div>
    `;
  }).join('');
}

// ──────────────────────────────────────────────
// INIT — load data from JSON file
// ──────────────────────────────────────────────
async function init() {
  document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  try {
    const resp = await fetch('data/polls.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    polls = await resp.json();
    renderPollList();
  } catch (err) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div style="color:#ff6c8c;">Failed to load polling data</div>
        <div style="font-size:0.85rem;">${err.message}</div>
        <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.5rem;">
          Make sure <code>data/polls.json</code> exists and the page is served via HTTP (not file://)
        </div>
      </div>
    `;
  }
}
init();
</script>

</body>
</html>
