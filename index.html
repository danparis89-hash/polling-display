<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opinion Polling Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface-hover: #242840;
      --border: #2e3348;
      --text: #e4e6f0;
      --text-muted: #8b8fa8;
      --accent: #6c8cff;
      --accent-hover: #8da6ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .layout {
      display: flex;
      height: calc(100vh - 62px);
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
    }

    .filter-tab {
      flex: 1;
      padding: 0.4rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .poll-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .poll-item {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .poll-item:hover {
      background: var(--surface-hover);
    }

    .poll-item.active {
      background: var(--surface-hover);
      border-left: 3px solid var(--accent);
    }

    .poll-item .poll-name {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .poll-item .poll-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .poll-type-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .badge-tracking { background: #1e3a5f; color: #6cb4ee; }
    .badge-snapshot { background: #3a2a1e; color: #eeb86c; }
    .badge-topic { background: #1e3a2a; color: #6ceeb8; }
    .badge-demographic { background: #2e1e3a; color: #c06cff; }

    /* Main content */
    .main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .poll-display {
      max-width: 900px;
      margin: 0 auto;
    }

    .poll-title-bar {
      margin-bottom: 1.75rem;
    }

    .poll-title-bar h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .poll-title-bar .poll-description {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .poll-info-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .info-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .info-chip .label {
      color: var(--text-muted);
      margin-right: 0.4rem;
    }

    /* Chart container */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .chart-card canvas {
      width: 100% !important;
      max-height: 400px;
    }

    /* Snapshot display */
    .snapshot-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .snapshot-question {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .snapshot-question h3 {
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
      font-weight: 500;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.85rem;
      gap: 0.75rem;
    }

    .bar-label {
      width: 140px;
      min-width: 140px;
      font-size: 0.85rem;
      text-align: right;
      color: var(--text);
    }

    .bar-track {
      flex: 1;
      height: 28px;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      transition: width 0.6s ease;
      min-width: fit-content;
    }

    .bar-value {
      width: 50px;
      min-width: 50px;
      text-align: right;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Legend for line chart */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 0.75rem;
    }

    .empty-state svg {
      opacity: 0.3;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; max-height: 45vh; }
      .layout { flex-direction: column; height: auto; }
      .main { padding: 1rem; }
      .bar-label { width: 100px; min-width: 100px; font-size: 0.78rem; }
    }

    .filter-section {
      margin-top: 0.75rem;
    }

    .filter-section label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.35rem;
    }

    .filter-select {
      width: 100%;
      padding: 0.4rem 0.6rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      appearance: auto;
    }

    .filter-select:focus {
      outline: 1px solid var(--accent);
    }

    /* Demographic selector in main view */
    .demographic-section {
      margin-top: 0.5rem;
    }

    .demographic-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .demo-tabs {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .demo-tab {
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .demo-tab:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .demo-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Polling Dashboard</h1>
    <div class="subtitle">Scottish environmental opinion polling</div>
  </div>
  <div style="color: var(--text-muted); font-size: 0.8rem;">
    Last updated: <span id="lastUpdated"></span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Polls</h2>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="type" data-value="all" onclick="setTypeFilter('all', this)">All</button>
        <button class="filter-tab" data-filter="type" data-value="tracking" onclick="setTypeFilter('tracking', this)">Tracking</button>
        <button class="filter-tab" data-filter="type" data-value="snapshot" onclick="setTypeFilter('snapshot', this)">Snapshot</button>
      </div>
      <div class="filter-section">
        <label for="topicFilter">Topic</label>
        <select class="filter-select" id="topicFilter" onchange="applyFilters()">
          <option value="all">All topics</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="sourceFilter">Source</label>
        <select class="filter-select" id="sourceFilter" onchange="applyFilters()">
          <option value="all">All sources</option>
        </select>
      </div>
    </div>
    <div class="poll-list" id="pollList"></div>
  </aside>

  <main class="main" id="mainContent">
    <div class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 4 5-8"/></svg>
      <div>Select a poll from the sidebar to view results</div>
    </div>
  </main>
</div>

<script>
// ──────────────────────────────────────────────
// DATA
// To update: edit the polls array below directly.
// A copy is also kept in data/polls.json.
// ──────────────────────────────────────────────

const COLORS = [
  '#6c8cff', '#ff6c8c', '#8cff6c', '#ffb86c',
  '#c06cff', '#6cffe0', '#ff6ce0', '#ffe06c'
];

let polls = [
  {
    id: "shs-climate-urgency",
    name: "Climate Change: Immediate and Urgent Problem",
    type: "tracking",
    source: "Scottish Household Survey",
    topic: "Climate Change",
    sampleSize: "~10,000 households",
    frequency: "Annual",
    description: "Percentage of adults who agree that 'climate change is an immediate and urgent problem'. Question first included in SHS in 2013. Note: 2020 and 2021 data collected by telephone due to COVID-19 and published as experimental statistics \u2014 not directly comparable to face-to-face years.",
    labels: ["2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020*", "2021*", "2022", "2023"],
    series: [
      { name: "Agree", data: [46, 45, 50, 55, 61, 65, 68, 80, 83, 74, 74] }
    ],
    demographics: [
      {
        name: "Age",
        series: [
          { name: "16\u201324", data: [38, 40, 46, null, 58, 67, 69, null, null, 60, null] },
          { name: "25\u201334", data: [47, null, null, null, null, null, 67, null, null, 78, null] },
          { name: "35\u201344", data: [54, null, null, null, null, null, 72, null, null, null, null] },
          { name: "45\u201359", data: [51, null, null, null, null, null, 72, null, null, null, null] },
          { name: "60\u201374", data: [42, null, null, null, null, null, 68, null, null, null, null] },
          { name: "75+", data: [33, null, null, null, null, 46, 56, null, null, 65, null] }
        ]
      },
      {
        name: "Gender",
        series: [
          { name: "Male", data: [null, null, null, null, null, null, 66, null, null, 74, null] },
          { name: "Female", data: [null, null, null, null, null, null, 70, null, null, 74, null] }
        ]
      },
      {
        name: "Education",
        series: [
          { name: "Degree or professional", data: [null, null, null, null, null, null, 80, null, null, 86, 84] },
          { name: "No qualifications", data: [null, null, null, null, null, null, 49, null, null, 58, 62] }
        ]
      }
    ]
  },
  {
    id: "shs-greenspace-satisfaction-2023",
    name: "Satisfaction with Nearest Green or Blue Space (2023)",
    type: "snapshot",
    source: "Scottish Household Survey",
    topic: "Green & Blue Spaces",
    sampleSize: "~10,000 households",
    date: "2023",
    description: "Satisfaction with nearest green or blue space, 2023. The overall satisfaction level (76% very or fairly satisfied) has remained at a similar level throughout the time series. Not asked in 2018 or 2022.",
    questions: [
      {
        text: "How satisfied are you with your nearest green or blue space?",
        options: [
          { label: "Very or fairly satisfied", value: 76 },
          { label: "Neither / no opinion", value: 14 },
          { label: "Very or fairly dissatisfied", value: 10 }
        ]
      }
    ],
    demographics: [
      {
        name: "Deprivation",
        text: "Satisfaction (very/fairly) by SIMD quintile (SHS 2023)",
        options: [
          { label: "Most deprived 20%", value: 64 },
          { label: "Least deprived 20%", value: 82 }
        ]
      },
    ]
  }
];

// Demographic overlay colors (distinct from the main series blue)
const DEMO_COLORS = [
  '#ff6c8c', '#8cff6c', '#ffb86c', '#c06cff', '#6cffe0', '#ff6ce0'
];

// ──────────────────────────────────────────────
// APP STATE
// ──────────────────────────────────────────────
let currentTypeFilter = 'all';
let currentTopicFilter = 'all';
let currentSourceFilter = 'all';
let activePollId = null;
let chartInstance = null;
let activeDemographic = null; // name of active demographic group or null

// ──────────────────────────────────────────────
// FILTERS
// ──────────────────────────────────────────────
function populateFilterDropdowns() {
  const topics = [...new Set(polls.map(p => p.topic).filter(Boolean))].sort();
  const sources = [...new Set(polls.map(p => p.source).filter(Boolean))].sort();

  const topicSel = document.getElementById('topicFilter');
  topicSel.innerHTML = '<option value="all">All topics</option>'
    + topics.map(t => `<option value="${t}">${t}</option>`).join('');

  const sourceSel = document.getElementById('sourceFilter');
  sourceSel.innerHTML = '<option value="all">All sources</option>'
    + sources.map(s => `<option value="${s}">${s}</option>`).join('');
}

function setTypeFilter(type, btn) {
  currentTypeFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  currentTopicFilter = document.getElementById('topicFilter').value;
  currentSourceFilter = document.getElementById('sourceFilter').value;
  renderPollList();
}

// ──────────────────────────────────────────────
// RENDER SIDEBAR
// ──────────────────────────────────────────────
function renderPollList() {
  const list = document.getElementById('pollList');
  const filtered = polls.filter(p => {
    if (currentTypeFilter !== 'all' && p.type !== currentTypeFilter) return false;
    if (currentTopicFilter !== 'all' && p.topic !== currentTopicFilter) return false;
    if (currentSourceFilter !== 'all' && p.source !== currentSourceFilter) return false;
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:1rem;color:var(--text-muted);font-size:0.85rem;text-align:center;">No polls match the current filters</div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="poll-item ${activePollId === p.id ? 'active' : ''}"
         onclick="selectPoll('${p.id}')">
      <div class="poll-name">${p.name}</div>
      <div class="poll-meta">
        <span class="poll-type-badge ${p.type === 'tracking' ? 'badge-tracking' : 'badge-snapshot'}">
          ${p.type}
        </span>
        ${p.topic ? `<span class="poll-type-badge badge-topic">${p.topic}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// ──────────────────────────────────────────────
// SELECT & DISPLAY A POLL
// ──────────────────────────────────────────────
function selectPoll(id) {
  activePollId = id;
  const poll = polls.find(p => p.id === id);
  renderPollList();

  if (poll.type === 'tracking') {
    renderTrackingPoll(poll);
  } else {
    renderSnapshotPoll(poll);
  }
}

// ──────────────────────────────────────────────
// TRACKING POLL (LINE CHART)
// ──────────────────────────────────────────────
function renderTrackingPoll(poll) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="poll-display">
      <div class="poll-title-bar">
        <h2>${poll.name}</h2>
        <div class="poll-description">${poll.description}</div>
      </div>
      <div class="poll-info-row">
        <div class="info-chip"><span class="label">Source:</span>${poll.source}</div>
        <div class="info-chip"><span class="label">Sample:</span>${poll.sampleSize}</div>
        <div class="info-chip"><span class="label">Frequency:</span>${poll.frequency}</div>
      </div>
      ${poll.demographics ? `
      <div style="margin-bottom:0.75rem;">
        <span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-right:0.5rem;">Demographic overlay:</span>
        <div class="demo-tabs" id="demoToggleTabs" style="display:inline-flex;">
          <button class="demo-tab ${!activeDemographic ? 'active' : ''}" onclick="setDemographicOverlay(null)">None</button>
          ${poll.demographics.map(d => `<button class="demo-tab ${activeDemographic === d.name ? 'active' : ''}" onclick="setDemographicOverlay('${d.name}')">${d.name}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="chart-card">
        <canvas id="trackingChart"></canvas>
        <div class="chart-legend" id="chartLegend"></div>
      </div>
      <div class="chart-card">
        <h3 style="font-size:0.9rem; margin-bottom:1rem; color:var(--text-muted);">Latest Values</h3>
        <div id="latestValues"></div>
      </div>
    </div>
  `;

  // Build chart
  buildTrackingChart(poll);

  // Latest values
  document.getElementById('latestValues').innerHTML = poll.series.map((s, i) => {
    const latest = s.data[s.data.length - 1];
    const prev = s.data[s.data.length - 2];
    const diff = latest - prev;
    const arrow = diff > 0 ? '&#9650;' : diff < 0 ? '&#9660;' : '&#8212;';
    const diffColor = diff > 0 ? '#8cff6c' : diff < 0 ? '#ff6c8c' : 'var(--text-muted)';
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
          <span>${s.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <span style="font-weight:600;font-size:1.1rem;">${latest}%</span>
          <span style="color:${diffColor};font-size:0.8rem;">${arrow} ${Math.abs(diff)}</span>
        </div>
      </div>
    `;
  }).join('');
}

function setDemographicOverlay(name) {
  activeDemographic = name;
  const poll = polls.find(p => p.id === activePollId);
  if (poll) renderTrackingPoll(poll);
}

function buildTrackingChart(poll) {
  const ctx = document.getElementById('trackingChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  // Main series
  const datasets = poll.series.map((s, i) => ({
    label: s.name,
    data: s.data,
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + '18',
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false
  }));

  // Demographic overlay series
  if (activeDemographic && poll.demographics) {
    const demo = poll.demographics.find(d => d.name === activeDemographic);
    if (demo) {
      demo.series.forEach((s, i) => {
        const color = DEMO_COLORS[i % DEMO_COLORS.length];
        datasets.push({
          label: s.name,
          data: s.data,
          borderColor: color,
          backgroundColor: color + '18',
          borderWidth: 2,
          borderDash: [6, 3],
          pointRadius: 3,
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false,
          spanGaps: true
        });
      });
    }
  }

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: poll.labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1d2e',
          borderColor: '#2e3348',
          borderWidth: 1,
          titleColor: '#e4e6f0',
          bodyColor: '#e4e6f0',
          padding: 12,
          filter: item => item.parsed.y !== null,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%`
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#2e334830' },
          ticks: { color: '#8b8fa8' }
        },
        y: {
          min: 0,
          grid: { color: '#2e334830' },
          ticks: { color: '#8b8fa8', callback: v => v + '%' }
        }
      }
    }
  });

  // Legend
  const legendEl = document.getElementById('chartLegend');
  let legendHtml = poll.series.map((s, i) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
      <span>${s.name}</span>
    </div>
  `).join('');

  if (activeDemographic && poll.demographics) {
    const demo = poll.demographics.find(d => d.name === activeDemographic);
    if (demo) {
      legendHtml += demo.series.map((s, i) => `
        <div class="legend-item">
          <div class="legend-dot" style="background:${DEMO_COLORS[i % DEMO_COLORS.length]};border:1px dashed ${DEMO_COLORS[i % DEMO_COLORS.length]}"></div>
          <span>${s.name}</span>
        </div>
      `).join('');
    }
  }
  legendEl.innerHTML = legendHtml;
}

// ──────────────────────────────────────────────
// SNAPSHOT POLL (HORIZONTAL BARS)
// ──────────────────────────────────────────────
function renderSnapshotPoll(poll) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="poll-display">
      <div class="poll-title-bar">
        <h2>${poll.name}</h2>
        <div class="poll-description">${poll.description}</div>
      </div>
      <div class="poll-info-row">
        <div class="info-chip"><span class="label">Source:</span>${poll.source}</div>
        <div class="info-chip"><span class="label">Sample:</span>${poll.sampleSize}</div>
        <div class="info-chip"><span class="label">Date:</span>${poll.date}</div>
      </div>
      <div class="snapshot-container" id="snapshotContainer"></div>
      ${poll.demographics ? '<div id="demographicSection"></div>' : ''}
    </div>
  `;

  const container = document.getElementById('snapshotContainer');
  container.innerHTML = poll.questions.map(q => {
    const maxVal = 100;
    const bars = q.options.map((opt, i) => {
      const color = COLORS[i % COLORS.length];
      const width = (opt.value / maxVal) * 100;
      return `
        <div class="bar-row">
          <div class="bar-label">${opt.label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${width}%;background:${color};">${opt.value > 8 ? opt.value + '%' : ''}</div>
          </div>
          <div class="bar-value" style="color:${color}">${opt.value}%</div>
        </div>
      `;
    }).join('');

    return `
      <div class="snapshot-question">
        <h3>${q.text}</h3>
        ${bars}
      </div>
    `;
  }).join('');

  // Demographics (snapshot uses bar charts for point-in-time breakdowns)
  if (poll.demographics) {
    const section = document.getElementById('demographicSection');
    section.innerHTML = poll.demographics.map(demo => {
      if (!demo.options) return '';
      const bars = demo.options.map((opt, i) => {
        const color = COLORS[i % COLORS.length];
        const width = (opt.value / 100) * 100;
        return `
          <div class="bar-row">
            <div class="bar-label">${opt.label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${width}%;background:${color};">${opt.value > 8 ? opt.value + '%' : ''}</div>
            </div>
            <div class="bar-value" style="color:${color}">${opt.value}%</div>
          </div>
        `;
      }).join('');
      return `
        <div class="chart-card" style="margin-top:1rem;">
          <h3 style="font-size:1.05rem; margin-bottom:1.25rem; font-weight:500;">${demo.text}</h3>
          ${bars}
        </div>
      `;
    }).join('');
  }
}

// ──────────────────────────────────────────────

document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('en-US', {
  year: 'numeric', month: 'long', day: 'numeric'
});
populateFilterDropdowns();
renderPollList();
</script>
